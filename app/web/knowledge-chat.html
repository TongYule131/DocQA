<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知识库对话 · DocQA</title><link rel="stylesheet" href="/static/product.css"><link rel="stylesheet" href="/static/conversation.css"><link rel="stylesheet" href="/static/knowledge-modules.css"><script defer src="/static/auth-bridge.js"></script><script type="module" src="/static/knowledge-chat.js"></script><link rel="stylesheet" href="/static/ui-refinements.css"><script type="module" src="/static/chat-shell.js"></script><link rel="stylesheet" href="/static/chat-layout.css"><link rel="stylesheet" href="/static/ui-controls.css"></head><body><div class="kb-chat-shell"><aside class="kb-chat-sidebar"><a class="brand" href="/app/knowledge"><span>D</span>DocQA</a><button id="new-chat" class="secondary">＋ 新建知识库会话</button><label for="kb-picker">选择知识库</label><select id="kb-picker"></select><p class="muted">在发布版全部资料中寻找依据</p><div class="kb-history" id="kb-history"></div><div class="sidebar-bottom"><details class="workspace-menu"><summary><span class="account-avatar">D</span><span class="account-name">工作空间</span></summary><div class="workspace-menu-items"><a href="/app">文档对话与临时附件</a><a id="kb-admin" href="/admin" hidden>管理后台</a><button class="text-button" data-logout hidden>退出登录</button></div></details></div></aside><main class="kb-chat-main"><header class="kb-chat-header"><div><strong id="chat-title">知识库对话</strong><p id="chat-scope" class="muted"></p></div><div class="row"><details class="chat-settings"><summary>会话设置</summary><button id="clear-memory" class="secondary">清除会话记忆</button></details><button id="chat-refresh" class="secondary">刷新</button></div></header><div class="kb-chat-scroll" id="kb-scroll"><div class="kb-chat-turns" id="kb-turns"></div><div class="kb-welcome" id="kb-welcome"><h1>从团队知识里找到答案</h1><p>选择知识库后提问，回答会附上可查看的原文来源。</p><p>也可以先说一句“你好”。</p></div></div><div class="kb-compose-area"><p id="chat-notice" role="status" aria-live="polite"></p><form id="kb-
