<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DocQA · 知识对话</title>
<link rel="stylesheet" href="/static/product.css"><link rel="stylesheet" href="/static/conversation.css"><link rel="stylesheet" href="/static/knowledge-modules.css"><link rel="stylesheet" href="/static/ui-refinements.css"><link rel="stylesheet" href="/static/chat-layout.css"><link rel="stylesheet" href="/static/unified-chat.css">
<script defer src="/static/auth-bridge.js"></script><script type="module" src="/static/unified-chat.js"></script><script type="module" src="/static/chat-shell.js"></script><link rel="stylesheet" href="/static/ui-controls.css"></head>
<body><div class="kb-chat-shell"><aside class="kb-chat-sidebar">
<a class="brand" href="/app"><span>D</span>DocQA</a><button id="new-chat" class="secondary">＋ 新建会话</button>
<label for="kb-picker" class="scope-label">新会话的知识库</label><select id="kb-picker" aria-label="选择知识库"></select>
<div class="history-title"><span>我的会话</span><button id="chat-refresh" class="icon-button secondary" aria-label="刷新会话">刷新</button></div>
<input id="history-search" type="search" placeholder="搜索会话…" aria-label="搜索会话"><label class="archive-filter"><input id="archived" type="checkbox">查看归档</label><div class="kb-history" id="kb-history"></div>
<div class="sidebar-bottom"><details class="workspace-menu"><summary><span class="account-avatar">D</span><span class="account-name">工作空间</span></summary><div class="workspace-menu-items"><a id="kb-admin" href="/admin" hidden>管理后台</a><button class="text-button" data-logout hidden>退出登录</button></div></details></div>
</aside><main class="kb-chat-main"><header class="kb-chat-header"><div class="chat-heading"><details id="chat-title-details" class="chat-title-details"><summary aria-label="展开或收起完整会话标题"><strong id="chat-title">知识对话</strong><span class="title-chevron" aria-hidden="true"></span></summary><p id="chat-title-full" class="chat-title-full">知识对话</p></details><p id="chat-scope" class="muted"></p></div><details class="chat-settings"><summary>会话设置</summary><div class="chat-settings-content">
<label for="chat-name">会话名称</label><input id="chat-name" maxlength="80"><button id="rename-chat" class="secondary">保存名称</button>
<fieldset id="entity-memory-tools" class="entity-memory-tools" aria-label="会话记忆与反馈"></fieldset><label for="memory-notes">记住我的条件</label><textarea id="memory-notes" maxlength="800" rows="3" placeholder="例如：回答简洁，保留金额和适用条件"></textarea><button id="save-notes" class="secondary">保存条件</button><button id="clear-memory" class="secondary">清除会话记忆</button><button id="archive-chat" class="secondary">归档会话</button></div></details></header>
<div class="kb-chat-scroll" id="kb-scroll"><div class="kb-chat-turns" id="kb-turns"></div><div class="kb-welcome" id="kb-welcome"><h1>让知识成为答案</h1><p>选择知识库，或上传资料开始对话。</p></div></div>
<div class="kb-compose-area"><div id="file-progress" class="file-progress"></div><p id="chat-notice" role="status" aria-live="polite"></p>
<form id="kb-form" class="kb-composer"><div class="composer-context"><details id="scope-filter"><summary id="scope-caption">选择资料</summary><div id="document-options" class="document-options"></div></details><span id="input-count">0 / 4000</span></div><p id="scope-empty-hint" class="scope-empty-hint" role="status">先选择本次回答可使用的资料。</p>
<textarea id="kb-input" rows="3" maxlength="4000" placeholder="输入问题，或继续当前会话…" aria-label="输入问题" required></textarea>
<div class="kb-composer-footer"><div class="row"><button id="upload-open" type="button" class="composer-add secondary" aria-label="上传文档" title="上传文档">＋</button><button id="kb-memory" type="button" class="memory-switch" role="switch" aria-checked="true" aria-label="会话记忆"><span class="switch-track" aria-hidden="true"></span><span class="switch-label">会话记忆</span></button></div><span class="compose-shortcuts">Enter 发送 · Shift+Enter 换行</span><div class="row"><button id="confirm-pending" type="button" class="secondary" hidden>确认原请求</button><button id="kb-send" type="submit" aria-label="发送问题" disabled>↑</button></div></div></form></div>
</main></div>
<dialog id="upload-dialog" class="upload-dialog"><form id="upload-form"><div class="dialog-title"><h2>上传到知识库</h2><button id="upload-close" type="button" class="secondary" aria-label="关闭上传">×</button></div><label for="upload-base">保存位置</label><select id="upload-base"></select><p class="muted" id="upload-policy"></p><label for="upload-file">选择文档</label><input id="upload-file" type="file" multiple accept=".pdf,.txt,.md,.docx,.xlsx" required><label for="replace-document">替换已有文档（可选，仅单文件）</label><select id="replace-document"><option value="">作为新资料加入</option></select><p id="upload-hint" class="muted">提交后自动解析、分块和建立索引；建立索引会使用已配置的向量服务。</p><p id="upload-error" role="status"></p><button id="upload-submit" type="submit">上传并准备资料</button></form></dialog>
<dialog id="kb-source" class="kb-source-dialog"><div class="dialog-title"><h2>引用来源</h2><button id="close-source" class="secondary" aria-label="关闭来源">×</button></div><div id="kb-source-content"></div></dialog>
</body></html>
