<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>设置管理员 · DocQA</title><link rel="stylesheet" href="/static/product.css"><script defer src="/static/auth-bridge.js"></script><script type="module" src="/static/setup.js"></script><link rel="stylesheet" href="/static/ui-controls.css"></head><body><main class="login-card"><a class="brand" href="/admin"><span>D</span>DocQA</a><h1>设置首位管理员</h1><p class="muted">设置后立即启用团队登录。已有资料由管理员管理，发布并授权后客户才可使用。仅能在服务器本机首次设置。</p><form id="setup-form" hidden><label for="username">管理员账号</label><input id="username" required minlength="2" maxlength="64" autocomplete="username"><label for="display-name">显示名称</label><input id="display-name" required maxlength="80" autocomplete="name"><label for="password">密码（4～32位）</label><input id="password" type="password" minlength="4" maxlength="32" required autocomplete="new-password"><label for="password-confirm">确认密码</label><input id="password-confirm" type="password" minlength="4" maxlength="32" required autocomplete="new-password"><button id="setup-submit">创建管理员并启用团队登录</button></form><p id="message" role="status" aria-live="polite">正在检查初始化状态…</p><a href="/admin">返回管理后台</a></main></body></html>
