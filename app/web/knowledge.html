<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知识库管理 · DocQA</title><link rel="stylesheet" href="/static/product.css"><script defer src="/static/auth-bridge.js"></script><script type="module" src="/static/knowledge.js"></script><link rel="stylesheet" href="/static/admin.css"><link rel="stylesheet" href="/static/ui-refinements.css"><script type="module" src="/static/admin-nav.js"></script></head>
<body><div class="admin-shell"><aside class="admin-sidebar"><a class="brand" href="/admin"><span>D</span>DocQA</a><p class="nav-caption">团队工作空间</p><nav aria-label="后台导航"></nav><div class="sidebar-bottom"></div></aside><div class="admin-content"><header class="admin-header"><span>知识库资料管理</span><div class="row"><span class="local-label"></span><button class="secondary" data-logout hidden>退出登录</button></div></header><main class="product-main admin-main"><div class="product-heading"><div><h1>知识库文档与授权</h1><p class="muted">选择知识库 → 上传 → 自动解析与索引 → 生效 → 授权问答。刷新只读取任务进度。</p></div><button id="refresh" class="secondary" type="button">刷新状态</button></div><div id="notice" role="status" aria-live="polite" hidden></div>
<div class="layout"><aside><section class="panel"><h2>知识库</h2><div id="base-list" class="base-list"></div><form id="base-form" class="new-base"><label for="base-name">新知识库名称</label><input id="base-name" maxlength="80" required placeholder="例如：产品使用手册"><button type="submit" style="margin-top:12px">创建知识库</button></form><a href="/admin/settings" class="button secondary">配置模型与分块参数</a></section></aside>
<div><section class="panel"><div class="row spread"><div><h2 id="base-title">资料收件箱</h2><p id="base-description" class="muted">可以先上传资料，再添加到知识库。</p></div><span id="base-status" class="badge">本地资料</span></div>
<form id="upload-form" class="upload-zone"><label for="upload-file">添加文档</label><input id="upload-file" type="file" accept=".pdf,.txt,.md,.docx,.xlsx" required><p id="upload-help" class="muted">支持 PDF、DOCX、XLSX、UTF-8 TXT / Markdown。正在读取上传上限…</p><label for="upload-replacement">替换已有文档（可选）</label><select id="upload-replacement"><option value="">作为新资料加入</option></select><div class="row"><button id="upload" type="submit">上传文档</button><span id="upload-status" class="muted" role="status"></span></div></form>
<form id="bind-form" class="row" hidden><select id="unbound-document" aria-label="选择已有文档"></select><button type="submit" class="secondary">加入已有文档</button></form><div id="documents" aria-live="polite"><p class="loading">正在读取资料…</p></div></section>
<section id="publish-panel" class="panel" hidden><div class="row spread"><h2>发布与访问授权</h2><button id="publish" type="button">发布当前资料</button></div><p class="muted">客户只检索已生效资料。自动模式逐份生效，审核模式逐份确认；已有手动管理的资料可使用“发布当前资料”。</p><label for="activation-policy">上传生效策略</label><select id="activation-policy"><option value="auto">自动生效</option><option value="review">管理员审核后生效</option></select><p id="published-summary" class="version-note"></p><div id="members" class="account-list"></div></section>
</div></div></main></div></div></body></html>
