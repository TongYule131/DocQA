<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>账号安全 · DocQA</title><link rel="stylesheet" href="/static/product.css"><link rel="stylesheet" href="/static/profile.css"><script defer src="/static/auth-bridge.js"></script><script type="module" src="/static/account-password.js"></script></head>
<body><main class="login-card account-security-card"><a class="brand" href="/app"><span>D</span>DocQA</a><h1 id="security-heading">修改密码</h1><p id="security-hint" class="muted">核对原密码后设置新密码。保存成功会撤销该账号的全部登录，请使用新密码重新登录。</p><p id="security-user"></p>
<form id="password-form"><label for="old-password">原密码</label><input id="old-password" type="password" autocomplete="current-password" maxlength="128" required><label for="new-password">新密码（4～32位）</label><input id="new-password" type="password" autocomplete="new-password" minlength="4" maxlength="32" required><label for="confirm-password">再次输入新密码</label><input id="confirm-password" type="password" autocomplete="new-password" minlength="4" maxlength="32" required><button id="save-password" type="submit">保存新密码</button></form>
<p id="message" role="status" aria-live="polite"></p><nav class="account-security-actions"><a id="security-back" href="/app">返回工作台</a><button class="secondary" type="button" data-logout hidden>退出登录</button></nav></main></body></html>
