<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · DocQA</title><link rel="stylesheet" href="/static/product.css"><script defer src="/static/auth-bridge.js"></script><script type="module" src="/static/login.js"></script></head>
<body><main class="login-card"><a class="brand" href="/app"><span>D</span>DocQA</a><h1>登录文档助手</h1><p class="muted">使用管理员分配的账号访问团队资料。</p><form id="login-form"><label for="username">账号</label><input id="username" autocomplete="username" maxlength="64" required><label for="password">密码</label><input id="password" type="password" autocomplete="current-password" maxlength="128" required><button id="login" type="submit">登录</button></form><p id="message" role="status" aria-live="polite"></p><p class="muted">首次使用请在服务器本机访问 /setup 设置管理员。忘记密码请联系管理员。</p></main></body></html>
