name: RAG offline quality
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  offline-quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m pip install --no-deps -e .
      - name: Record legacy retrieval on the same golden scenarios
        run: python scripts/evaluate_rag_quality.py --strategy legacy --report rag-baseline.json
      - name: Evaluate frozen retrieval scenarios without providers
        run: python scripts/evaluate_rag_quality.py --gate --baseline rag-baseline.json --report rag-quality.json
      - name: Verify evaluation, source isolation and question protocol
        run: python -m pytest tests/test_rag_evaluation.py tests/test_rag_live_plan.py tests/test_retrieval_planning.py tests/test_task_answer_protocol.py tests/test_rag_answer_contract.py tests/test_rag_contract_review.py tests/test_rag_scope_evaluation.py tests/test_quote_spans.py tests/test_question_worker.py -q
      - name: Verify fact context and answer-part guards without models
        run: python scripts/evaluate_answer_contract.py --report answer-contract.json
      - name: Replay explicitly labelled scope bindings without providers
        run: python scripts/evaluate_rag_scope.py --report scope-retention.json
      - run: node tests/web/render_safety.mjs
      - run: node tests/web/question_jobs.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rag-offline-quality
          path: |
            rag-baseline.json
            rag-quality.json
            answer-contract.json
            scope-retention.json
